<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>どうぶつしょうぎ 強化AI</title>
<style>body{font-family:system-ui;text-align:center;background:#faf4e8;color:#342b25}#board{display:grid;grid-template-columns:repeat(3,90px);justify-content:center;gap:3px;margin:20px}button{font-size:18px;padding:12px;border:2px solid #a18b70;border-radius:8px;background:#fff}#board button{height:90px;font-size:42px}button.enemy{transform:rotate(180deg);background:#e5edff}button.selected{outline:4px solid #e97721}#hand button{font-size:32px;margin:4px}button:disabled{opacity:.75}p{min-height:24px}</style>
<h1>どうぶつしょうぎ</h1><p>強化AIと対戦</p><button id="first" disabled>先手で開始</button> <button id="second" disabled>後手で開始</button><p id="status" role="status">読み込み中…（インターネット接続が必要です）</p><div id="board" aria-label="盤面"></div><div id="hand" aria-label="持ち駒"></div><p>駒を選び、移動先をクリックしてください。持ち駒は空きマスに打てます。</p>
<script src="https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.js"></script><script>
const code=__PYTHON__, icons={lion:'🦁',elephant:'🐘',giraffe:'🦒',chick:'🐤',hen:'🐔'};
let py,state,selected=null,busy=false,started=false;
const status=document.querySelector('#status');
function render(){state=JSON.parse(py.runPython('snapshot()')); const board=document.querySelector('#board');board.replaceChildren();state.board.forEach((row,r)=>row.forEach((p,c)=>{const b=document.createElement('button');b.textContent=p?icons[p.promoted?'hen':p.name]:'·';b.className=p?.owner===1?'enemy':'';if(JSON.stringify(selected)===JSON.stringify([r,c]))b.classList.add('selected');b.disabled=busy||!!state.reason||!started;b.setAttribute('aria-label',`${r+1}行${c+1}列 ${p?p.name:'空き'}`);b.onclick=()=>click(r,c);board.append(b)}));const hand=document.querySelector('#hand');hand.replaceChildren();state.hand.forEach((name,i)=>{const b=document.createElement('button');b.textContent=icons[name];b.disabled=busy||!!state.reason;b.onclick=()=>{selected=['hand',i];render()};if(selected?.[0]==='hand'&&selected[1]===i)b.className='selected';hand.append(b)});status.textContent=state.reason?(state.winner===null?'千日手：引き分け':`${state.winner===0?'あなた':'AI'}の勝ち（${state.reason==='try'?'トライ':'ライオン捕獲'}）`):busy?'AIが考えています…':started?'あなたの番です':'先手・後手を選んでください';}
async function respond(){if(state.reason||state.turn!==1)return;busy=true;render();await new Promise(r=>setTimeout(r,30));try{py.runPython('ai()')}finally{busy=false;render()}}
async function click(r,c){if(busy||state.turn!==0)return;if(selected){const move=selected[0]==='hand'?['drop',selected[1],r,c]:['move',...selected,r,c];selected=null;if(state.moves.some(m=>JSON.stringify(m)===JSON.stringify(move))){py.globals.set('js_move',JSON.stringify(move));py.runPython('play_json(js_move)');render();await respond();return;}}if(state.board[r][c]?.owner===0)selected=[r,c];render();}
async function start(first){if(busy)return;started=true;selected=null;py.runPython(`restart(${first?'True':'False'})`);render();await respond()}
(async()=>{try{py=await loadPyodide();py.runPython(code);py.runPython('restart(True)');document.querySelector('#first').disabled=false;document.querySelector('#second').disabled=false;document.querySelector('#first').onclick=()=>start(true);document.querySelector('#second').onclick=()=>start(false);render()}catch(e){status.textContent='読み込みに失敗しました。ネット接続を確認して再読み込みしてください。';console.error(e)}})();
</script></html>
